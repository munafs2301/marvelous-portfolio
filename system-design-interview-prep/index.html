`Run the prime counting for loop on one laptop and it will never finish.`],
['m',`Describe the prime-number example.`,
`Divide the range among 10 computers (computer 1 does 0 to 10¹⁰, computer 2 does 10¹⁰+1 to 10²⁰ and so on), compute in parallel, and combine the partial results.`,
`Each worker returns a count, and the coordinator adds them.`],
['m',`Give examples of distributed systems from earlier topics.`,
`Sharding (a table spread across servers), horizontal scaling (many servers handle requests), and distributed databases such as Cassandra, DynamoDB, MongoDB, Google Spanner and Redis.`,
`Cassandra shards data across many nodes.`],
['m',`How should a distributed system look to the client?`,
`Like a single machine. The system accepts requests, performs the work across nodes and returns a result.`,
`You call one endpoint; behind it, 50 nodes cooperate.`],
['m',`What is the hardest part of a distributed system?`,
`Coordination: how machines cooperate, divide work evenly, handle failures and agree on state.`,
`What if worker 7 crashes halfway through its share?`],
['m',`What is the leader-follower model?`,
`One server is the leader. It accepts client requests, assigns work to followers, collects their results, combines them and replies. Followers do the assigned work.`,
`A leader splits a 1 TB job into 10 shards for 10 followers.`],
['m',`When does the system need to pick a leader?`,
`When it first starts, and whenever the current leader goes down. Followers must detect the failure quickly.`,
`Heartbeats stop arriving from the leader, so followers start an election.`],
['m',`How does the CAP theorem relate to distributed systems?`,
`CAP is the fundamental trade-off for any distributed system: during a network partition you must choose between consistency and availability.`,
`Cassandra leans AP. Systems with strict consensus lean CP.`],
['h',`What failure modes make distributed systems hard?`,
`Node crashes, network partitions, slow nodes, message loss or duplication, and clock differences. Designs need replication, timeouts, retries, idempotency and agreed leader or consensus mechanisms.`,
`A retry after a timeout might run the same payment twice unless the operation is idempotent.`]
]});

T.push({t:`Leader election and auto-recovery`,q:[
['e',`What is leader election?`,
`A mechanism that lets the servers in a distributed system agree on which one is the leader, both initially and after a leader failure.`,
`Five nodes start; the algorithm picks node 3 as leader.`],
['m',`Name some leader election algorithms and their complexity.`,
`LCR: O(N²). HS: O(N log N). Bully: O(N). Gossip protocol: O(log N). For system design it is enough to treat them as a black box.`,
`Bully: the highest-ID live node becomes leader.`],
['e',`What problem does an orchestrator solve?`,
`It monitors servers and automatically restarts any that go down, so you do not have to watch them manually.`,
`You always want at least 4 servers running; the orchestrator keeps it that way.`],
['m',`Who monitors the orchestrator?`,
`You run several orchestrators, elect one as leader-orchestrator, and have it watch the others. If the leader goes down, a worker orchestrator promotes itself using the leader election algorithm.`,
`Leader → watches worker-orchestrators → watch application servers.`],
['m',`Describe the full auto-recovery chain.`,
`A server dies → a worker-orchestrator restarts it. A worker-orchestrator dies → the leader restarts it. The leader dies → a worker orchestrator becomes leader via election. No human intervention is needed.`,
`Self-healing: the system repairs each layer by itself.`],
['m',`How do nodes detect that a leader or server is down?`,
`Heartbeats: periodic signals (HTTP or TCP requests every few seconds). If heartbeats stop, the node is considered failed.`,
`Followers expect a heartbeat every 3 seconds; none for 10 seconds triggers election.`],
['m',`Where is this pattern used in practice?`,
`Container orchestration and cluster managers (for example Kubernetes and Docker Swarm) and distributed databases use leader election and consensus for high availability.`,
`Docker Swarm uses Raft internally.`],
['h',`What is split-brain and how do you avoid it?`,
`Two nodes both believe they are the leader, typically after a network partition, causing conflicting writes. Avoid it with majority quorums so only the partition with more than 50% of nodes can elect a leader.`,
`In a 5-node cluster, the side with 3 nodes keeps a leader; the side with 2 cannot.`],
['h',`Why not just keep one very reliable orchestrator?`,
`Any single instance is a single point of failure, however reliable. Replication plus leader election removes the SPOF.`,
`Hardware failure takes out one orchestrator; the others carry on.`],
['h',`What is the role of consensus algorithms like Raft here?`,
`They let nodes agree on a leader and on the order of changes, usually requiring acknowledgement from more than 50% of nodes. Raft is a relatively easy one to learn.`,
`A write is committed once 3 of 5 nodes acknowledge it.`]
]});

T.push({t:`Big data tools`,q:[
['e',`Why do we need big data tools?`,
`A single machine cannot process very large datasets; it chokes or is too slow. Big data tools use distributed systems to split the work across many machines.`,
`Training a model on terabytes of data.`],
['e',`Name some big data tools.`,
`Apache Spark and Apache Flink are the examples mentioned.`,
`Spark jobs written in Python, Java or Scala.`],
['m',`Describe the coordinator-worker architecture.`,
`The client sends a request to the coordinator. It divides the large dataset into smaller parts, assigns them to workers, collects results, combines them and returns the final answer.`,
`Count word frequency across 10 TB of logs: each worker counts its chunk.`],
['m',`What responsibilities does the coordinator have?`,
`Move data to another machine if a worker crashes, restart failed workers (recovery), combine individual results, handle scaling and redistribution of data, and logging.`,
`Worker 4 dies at 80%; the coordinator reassigns its chunk.`],
['m',`When should you use a distributed big data approach?`,
`When a single EC2 instance cannot handle the data or computation.`,
`Training ML models, analysing social networks, recommendations, or ingesting data from many sources into a warehouse.`],
['m',`Why use Spark instead of building your own coordinator and workers?`,
`Building this infrastructure is very hard and the problem is common, so open-source tools provide it. You only write business logic and use the tool as a black box.`,
`You write the transformation in PySpark; Spark runs it distributed.`],
['m',`What do you focus on when using a tool like Spark?`,
`The business logic (jobs), not the plumbing of distribution, failure handling and scheduling.`,
`A job that cleans data and computes daily active users.`],
['m',`How do big data tools relate to sharding and distributed systems?`,
`They use the same distributed-system ideas: partition data, process in parallel, and combine results.`,
`Each worker processes one data partition, like a shard.`],
['h',`What is the difference between batch and stream processing?`,
`Batch processes large accumulated datasets at intervals (Spark batch jobs). Stream processes events continuously as they arrive (Flink, Spark Streaming), often reading from Kafka.`,
`Nightly sales report: batch. Live fraud detection: stream.`],
['h',`How much of this do you need for a system design interview?`,
`Understanding the coordinator-worker idea and when it is needed is enough. Deep knowledge of big-data internals is learned on the job in data-heavy companies.`,
`Say "I would use Spark for this analytics pipeline" and explain why.`]
]});

T.push({t:`Consistency deep dive`,q:[
['e',`Stateful vs stateless: why does consistency matter only for stateful systems?`,
`Stateless servers hold no useful data, so there is nothing to keep in sync. Consistency concerns data copies across nodes, so it arises with distributed, stateful systems like databases.`,
`Application servers: stateless. Databases: stateful.`],
['e',`What is strong consistency?`,
`Any read after a write returns the most recent write. Once a write is acknowledged, all later reads reflect it, as if only one copy of the data existed.`,
`You transfer money, and your balance immediately shows the new value from any node.`],
['e',`What is eventual consistency?`,
`After a write, replicas may briefly differ, but given time they all converge to the same value. It favours availability and speed over immediate agreement.`,
`A like count shows 100 on one node and 102 on another for a few seconds.`],
['m',`When do you choose strong consistency?`,
`When incorrect or stale data is unacceptable: banking transfers, trading apps showing correct share prices.`,
`Never show two different balances for one account.`],
['m',`When do you choose eventual consistency?`,
`When temporary staleness is acceptable: social media like counts, e-commerce product catalogues.`,
`A catalogue price update propagating over a few seconds is fine.`],
['m',`How does consistency relate to CAP?`,
`Giving up some consistency buys high availability. Eventual consistency is an AP choice, strong consistency is a CP choice.`,
`During a partition, the AP system serves stale data, the CP system refuses writes.`],
['m',`What is synchronous replication?`,
`The write is applied to all replicas before acknowledging the client. It gives strong consistency but slower writes and reduced availability if a replica is down.`,
`Google Spanner uses synchronous replication.`],
['h',`Explain quorum-based consistency. What is the W + R > N rule?`,
`With N replicas, a write must be acknowledged by W nodes and a read must consult R nodes. If W + R > N, the read and write sets overlap so a read sees the latest write (strong consistency). If W + R ≤ N, they may not overlap (eventual consistency).`,
`N = 5, W = 3, R = 3: 6 > 5, strongly consistent. N = 5, W = 1, R = 1: eventual.`],
['m',`Which databases are mentioned as using quorum approaches?`,
`AWS DynamoDB and Cassandra. DynamoDB in eventual-consistency mode uses relaxed quorums.`,
`Check each database's consistency options before choosing it.`],
['m',`What are consensus algorithms and an example?`,
`Algorithms where nodes agree on a value using a leader, and an operation succeeds when more than 50% of nodes acknowledge it. Raft is an easy example.`,
`Docker Swarm uses Raft internally.`],
['m',`What is asynchronous replication?`,
`The write is acknowledged immediately and propagated to replicas in the background. It is fast and highly available but replicas can be stale.`,
`Cassandra, MongoDB and DynamoDB (default mode).`],
['h',`What are vector clocks, at a high level?`,
`A mechanism to track the causal order of updates across replicas so the system can detect concurrent conflicting writes. It is a niche topic; know it exists, as DynamoDB-style systems use the idea.`,
`Two replicas update the same key independently. Vector clocks reveal the updates are concurrent and need resolution.`],
['m',`How does the gossip protocol help achieve eventual consistency?`,
`Nodes exchange heartbeats and updates with a subset of other nodes periodically, spreading information through the cluster and detecting failed nodes.`,
`Cassandra and DynamoDB use gossip.`],
['h',`How are conflicts resolved under eventual consistency?`,
`With a conflict resolution mechanism chosen for the use case: last-write-wins, merge functions, version vectors, or application-level resolution.`,
`Shopping cart: merge both versions rather than dropping an item.`]
]});

T.push({t:`Consistent hashing`,q:[
['e',`What is consistent hashing?`,
`An algorithm that tells which data belongs to which node, designed to minimise data movement when nodes are added or removed. It only decides placement; moving the data is your job.`,
`Used internally by DynamoDB, Cassandra and Riak.`],
['e',`Where is consistent hashing used?`,
`Mostly with stateful, distributed systems such as databases. Application servers are stateless, so they rarely need it unless you are building a database yourself.`,
`A key-value store deciding which server holds <code>user:42</code>.`],
['m',`What is the simple hashing approach and what is its drawback?`,
`Hash the key and take modulo the number of servers: <code>hash(key) % N</code>. It works for a fixed number of servers, but when N changes, most keys map to a different server, causing massive data movement.`,
`<code>hash(key1) % 3</code> becomes <code>hash(key1) % 2</code> and key1 may move.`],
['m',`How does consistent hashing work?`,
`Hash server IDs onto a ring covering the hash range. Hash each key onto the same ring. A key belongs to the first server clockwise from its position.`,
`Key-1 and key-4 → Node-1, key-3 → Node-2, key-2 and key-5 → Node-3.`],
['m',`What happens when a node is removed from the ring?`,
`Only the keys that belonged to that node move to the next clockwise node. All other keys stay where they are.`,
`Remove Node-2: key-3 moves to Node-1, nothing else changes.`],
['m',`What happens when a node is added?`,
`The new node takes over only the keys between its predecessor and itself, from the next node clockwise. Everything else is unaffected.`,
`A new node lands between Node-1 and Node-2 and takes a slice of Node-2's keys.`],
['m',`Does consistent hashing move the data for you?`,
`No. It only tells you which node owns which key. You must copy or snapshot data between servers yourself or through the database.`,
`After removing a node, run a job to copy its keys to the next node.`],
['h',`What problems can arise with a basic ring and how are they fixed?`,
`Uneven distribution if servers land close together on the ring, and overload of the next node on failure. Virtual nodes (each server placed at many ring positions) spread load more evenly.`,
`Give each server 100 virtual positions.`],
['m',`Which hash functions can be used?`,
`Any good hash function such as SHA, MD5 and so on, mapping to a large range (for example 0 to 2¹²⁸).`,
`Ring range is the output range of the hash function.`],
['h',`How would you explain consistent hashing vs hash-based sharding?`,
`Hash-based sharding with modulo reshuffles most data when shard count changes. Consistent hashing reshuffles only a small fraction, which is why dynamic clusters prefer it.`,
`Adding a 4th shard remaps about 75% of keys with modulo but only about 25% with consistent hashing.`]
]});

T.push({t:`Data redundancy and recovery`,q:[
['e',`What is data redundancy?`,
`Keeping multiple copies of the same data on different database servers.`,
`The same orders table lives on two servers in different locations.`],
['e',`Why make databases redundant?`,
`To survive disasters (a data centre destroyed by flood) and technical failures (disk crash or corruption) without losing data.`,
`Primary disk fails; the replica still holds everything.`],
['m',`What are traditional backup strategies?`,
`Daily or weekly backups where a snapshot is taken and stored on a different server. You can recover only up to the last backup.`,
`Nightly snapshot at 2 AM means up to a day of data can be lost.`],
['m',`What is the drawback of daily or weekly backups?`,
`Data written after the last backup is lost on failure, and restoring can take time. That is why most companies now use continuous redundancy.`,
`A crash at 11 PM loses 21 hours of orders if the last backup was at 2 AM.`],
['m',`What is continuous redundancy?`,
`A main database and a replica are always kept in sync. Reads and writes happen on the main and replicate synchronously or asynchronously to the replica.`,
`MySQL primary replicating to a standby.`],
['m',`What does the replica do in this setup?`,
`It does not serve client reads or writes; it only stays in sync. If the main fails, the replica is promoted and starts serving.`,
`Failover from primary to replica within seconds.`],
['m',`Synchronous vs asynchronous replication for the replica: which to choose?`,
`Synchronous: no data loss but slower writes. Asynchronous: faster writes, but a small window of potential data loss at failure. Choose by business criticality.`,
`Payments: synchronous. Analytics events: asynchronous.`],
['h',`What are RPO and RTO?`,
`Recovery Point Objective: how much data loss is acceptable (time). Recovery Time Objective: how long recovery may take. They drive your backup and failover design.`,
`RPO 0 and RTO 30 seconds → synchronous replica with automatic failover.`],
['h',`Is a replica a replacement for backups?`,
`Not entirely. A replica copies mistakes too: if someone drops a table, the replica drops it as well. Point-in-time backups protect from logical errors, replicas protect from hardware failure.`,
`Keep snapshots in addition to replication.`],
['m',`How would you practise setting this up?`,
`Use a cloud service such as AWS RDS to create a replica, and also set up two MySQL servers locally, write to the main, and verify the data appears in the replica.`,
`Insert a row on the main and select it on the replica.`]
]});

T.push({t:`Proxy: forward and reverse`,q:[
['e',`What is a proxy?`,
`An intermediary server that sits between a client and another server.`,
`A VPN or Nginx in front of your app.`],
['e',`What is a forward proxy?`,
`A proxy that acts on behalf of the client. The server sees only the proxy's IP, so the client's identity is hidden.`,
`A VPN requests websites for you.`],
['e',`What is a reverse proxy?`,
`A proxy that acts on behalf of servers. Clients talk to it and never see the real backend servers.`,
`Nginx or HAProxy routing to backend servers.`],
['m',`What is the key difference between forward and reverse proxies?`,
`Forward proxy hides the client from servers. Reverse proxy hides the servers from clients.`,
`VPN user vs website visitor hitting a load balancer.`],
['m',`What are the use cases of a forward proxy?`,
`Access geo-blocked content, cache frequently accessed content for clients, and let organisations filter employees' internet usage.`,
`A college blocks social media through its proxy.`],
['m',`What are the use cases of a reverse proxy?`,
`Load balancing, SSL termination (encryption and decryption off the servers), caching static content, and security by not exposing backend servers directly.`,
`HTTPS ends at Nginx; backends speak plain HTTP internally.`],
['m',`Is a load balancer a reverse proxy?`,
`Yes. Clients know only the load balancer's address, not the actual servers behind it.`,
`Requests to <code>abc.com</code> are forwarded to one of many backends.`],
['m',`Describe the request flow through a reverse proxy.`,
`Client requests <code>www.abc.com</code> → the reverse proxy receives it → forwards to one of the backend servers → the server responds to the proxy → the proxy responds to the client.`,
`The client never learns the backend IPs.`],
['m',`How would you build a simple reverse proxy for Product and Order services?`,
`Run a proxy server (for example NodeJS with <code>http-proxy</code>) on port 8080. If the URL starts with <code>/product</code>, forward to the Product service on port 5001. If it starts with <code>/order</code>, forward to port 5002. Otherwise return 404.`,
`<code>localhost:8080/product</code> reaches the Product service.`],
['m',`What does a 502 Bad Gateway mean in the proxy code?`,
`The proxy could not get a valid response from the upstream service (down or unreachable), so it returns 502 to the client.`,
`Product service crashed → client sees 502.`],
['m',`Why use Nginx instead of your own reverse proxy in production?`,
`Specialised proxies are highly optimised and provide features like caching and SSL termination. Do not reinvent the wheel.`,
`Learn Nginx and use it in your side projects.`],
['h',`How does an API gateway relate to a reverse proxy?`,
`An API gateway is a reverse proxy specialised for APIs. It adds routing plus rate limiting, authentication, caching and request transformation in front of microservices.`,
`The gateway validates a JWT, applies a rate limit, then routes to a service.`]
]});

T.push({t:`How to solve any system design problem`,q:[
['e',`What approach does the article suggest for solving a system design problem?`,
`Understand the problem, break it into small solvable sub-problems, then solve each sub-problem by deciding database, caching, scaling and fault tolerance, and communication style.`,
`E-commerce: listing, search, orders, payments.`],
['e',`Why should you start by understanding the problem statement?`,
`Requirements define what to build and what scale to design for. Wrong assumptions give a wrong design.`,
`Ask: "Is it read-heavy? How many users? Do we need real-time updates?"`],
['m',`How do you break a big problem into sub-problems? Example?`,
`List the main features and treat each as a sub-problem. Only create a new sub-problem when truly needed, not to over-complicate the design.`,
`Amazon-like app: product listing, product search, order, payment.`],
['m',`What four things should you decide for each sub-problem?`,
`Database, caching, scaling and fault tolerance, and communication (synchronous or asynchronous).`,
`Order service: SQL for ACID, no cache for writes, multiple instances, REST for payment but events for notifications.`],
['m',`How do you pick the database for a sub-problem?`,
`Use SQL for structured, consistency-critical data such as orders and payments, and NoSQL for flexible, massive, low-latency data such as reviews, feeds and locations.`,
`Product catalogue: document DB. Payments: PostgreSQL.`],
['m',`When do you add caching in your design?`,
`When reads dominate and data is reused. Frequently read, rarely changed data is ideal, such as product details or rankings.`,
`Cache product pages in Redis with a TTL.`],
['m',`How do you decide between sync and async communication?`,
`Synchronous when the caller needs the result immediately. Asynchronous through a broker when the work is slow, non-critical or must fan out.`,
`Payment: sync. Email, inventory, analytics: async events.`],
['m',`What is the role of estimation in the process?`,
`A quick estimate of load, storage and servers guides decisions such as whether to shard, add replicas or cache. Spend about 5 minutes.`,
`1 million reads per second means caching is mandatory.`],
['h',`How do you handle scale and fault tolerance in your design?`,
`Stateless services scaled horizontally behind a load balancer with auto scaling, replicated databases, queues to absorb spikes, and no single point of failure.`,
`Two availability zones, replica DBs, multiple gateway instances.`],
['h',`How would you structure a 45-minute system design interview?`,
`Clarify requirements and constraints, do a brief estimate, sketch the high-level design, go deep on key sub-problems (data model, scaling, caching, consistency), discuss trade-offs and bottlenecks, and summarise. Keep communicating your reasoning.`,
`About 5 min requirements, 5 min estimation, 15 min HLD, 15 min deep dive, 5 min wrap-up.`]
]});



(function(){
const LV={e:'Easy',m:'Medium',h:'Hard'};
const strip=h=>h.replace(/<[^>]+>/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
const ALL=[];
T.forEach((t,ti)=>t.q.forEach((x,qi)=>ALL.push({id:ti+'-'+qi,ti,qi,lvl:x[0],q:x[1],a:x[2],ex:x[3],text:strip(x[1]+' '+x[2]+' '+x[3]).toLowerCase()})));
const BY=Object.fromEntries(ALL.map(x=>[x.id,x]));

/* storage with in-memory fallback */
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?(mem[k]??null):v}catch(e){return mem[k]??null}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
let known=new Set();
try{const a=JSON.parse(store.get('sd-known')||'[]');if(Array.isArray(a))a.forEach(i=>BY[i]&&known.add(i))}catch(e){}
const saveKnown=()=>store.set('sd-known',JSON.stringify([...known]));

let cur=0,lvl='all',quiz=false,hideKnown=false,search='';
const open=new Set(),revealed=new Set();
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* initial topic from hash or storage */
(function(){
  const m=/^#topic-(\d+)$/.exec(location.hash||'');
  let n=m?+m[1]-1:+(store.get('sd-topic')||0);
  cur=(n>=0&&n<T.length)?n:0;
  if(store.get('sd-quiz')==='1')quiz=true;
})();

function topicCounts(ti){const total=T[ti].q.length;let k=0;T[ti].q.forEach((_,qi)=>{if(known.has(ti+'-'+qi))k++});return{k,total}}

function renderRail(){
  $('topics').innerHTML=T.map((t,i)=>{
    const c=topicCounts(i);
    return `<li><button class="t-item" data-t="${i}" ${(!search&&i===cur)?'aria-current="true"':''}>
      <span class="t-row"><b>${esc(t.t)}</b><small>${c.k}/${c.total}</small></span>
      <span class="t-bar"><i style="width:${c.k/c.total*100}%"></i></span></button></li>`}).join('');
}
function renderOverall(){
  const n=known.size,tot=ALL.length;
  $('overallBar').style.width=(n/tot*100)+'%';
  $('overallTxt').textContent=n+' of '+tot+' marked known';
}
function items(){
  const q=search.trim().toLowerCase();
  let it=q?ALL.filter(x=>x.text.includes(q)):ALL.filter(x=>x.ti===cur);
  if(lvl!=='all')it=it.filter(x=>x.lvl===lvl);
  if(hideKnown)it=it.filter(x=>!known.has(x.id));
  return it;
}
function cardHTML(x,showFrom){
  const isOpen=open.has(x.id),isK=known.has(x.id),isR=revealed.has(x.id);
  return `<article class="card ${x.lvl} ${isOpen?'open':''} ${isK?'known':''} ${isR?'revealed':''}" data-id="${x.id}">
    <button class="qhead" aria-expanded="${isOpen}" data-act="toggle">
      <span class="qtext">${esc(x.q)}</span>
      <span class="qmeta"><span class="tick">${isK?'Known':''}</span><span class="lv">${LV[x.lvl]}</span><i class="chev"></i></span>
      ${showFrom?`<span class="from">${esc(T[x.ti].t)}</span>`:''}
    </button>
    <div class="body" ${isOpen?'':'hidden'}>
      <button class="btn reveal" data-act="reveal">Show answer</button>
      <div class="answer"><p>${x.a}</p><div class="ex"><b>Example</b>${x.ex}</div></div>
      <div class="foot"><button class="known-btn" data-act="known" aria-pressed="${isK}">${isK?'Marked as known':'Mark as known'}</button></div>
    </div></article>`;
}
function renderList(){
  const q=search.trim();
  const it=items();
  document.body.classList.toggle('quiz',quiz);
  if(q){
    $('topicTitle').textContent='Search results';
    $('topicMeta').textContent=it.length+(it.length===1?' question matches ':' questions match ')+'“'+q+'” across all topics.';
  }else{
    const c=topicCounts(cur);
    $('topicTitle').textContent=T[cur].t;
    $('topicMeta').textContent=c.total+' questions, '+c.k+' marked known'+(lvl!=='all'?'. Showing '+LV[lvl].toLowerCase()+' only':'')+'.';
  }
  $('list').innerHTML=it.length?it.map(x=>cardHTML(x,!!q)).join(''):
    `<div class="empty">${q?'No questions match your search. Try a shorter keyword like “cache” or “shard”.':(hideKnown?'Every question here is marked known. Turn off “Hide known” to review them.':'No questions at this difficulty in this topic. Choose another level.')}</div>`;
  renderNav();
}
function renderNav(){
  if(search.trim()){$('nav').innerHTML='';return}
  const p=cur>0?`<button class="btn" data-go="${cur-1}">Previous: ${esc(T[cur-1].t)}</button>`:'<span></span>';
  const n=cur<T.length-1?`<button class="btn primary" data-go="${cur+1}">Next: ${esc(T[cur+1].t)}</button>`:'';
  $('nav').innerHTML=p+n;
}
function renderAll(){renderRail();renderOverall();renderList()}
function selectTopic(i,scroll){
  cur=i;search='';$('search').value='';
  store.set('sd-topic',String(i));
  try{history.replaceState(null,'','#topic-'+(i+1))}catch(e){}
  document.body.classList.remove('rail-open');
  renderAll();
  if(scroll!==false)window.scrollTo({top:0});
}

/* events */
$('topics').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)selectTopic(+b.dataset.t)});
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)selectTopic(+b.dataset.go)});
$('list').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const card=a.closest('.card'),id=card.dataset.id;
  if(a.dataset.act==='toggle'){
    const o=!open.has(id);o?open.add(id):open.delete(id);
    card.classList.toggle('open',o);a.setAttribute('aria-expanded',o);card.querySelector('.body').hidden=!o;
  }else if(a.dataset.act==='reveal'){
    revealed.add(id);card.classList.add('revealed');
  }else if(a.dataset.act==='known'){
    known.has(id)?known.delete(id):known.add(id);saveKnown();
    if(hideKnown){renderAll();return}
    const k=known.has(id);
    card.classList.toggle('known',k);
    card.querySelector('.tick').textContent=k?'Known':'';
    a.textContent=k?'Marked as known':'Mark as known';a.setAttribute('aria-pressed',k);
    renderRail();renderOverall();
    if(!search.trim()){const c=topicCounts(cur);$('topicMeta').textContent=c.total+' questions, '+c.k+' marked known'+(lvl!=='all'?'. Showing '+LV[lvl].toLowerCase()+' only':'')+'.'}
  }
});
let st;$('search').addEventListener('input',e=>{clearTimeout(st);st=setTimeout(()=>{search=e.target.value;renderRail();renderList()},120)});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  lvl=c.dataset.lvl;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));renderList()}));
function setSw(el,v){el.setAttribute('aria-checked',v)}
$('quizSw').addEventListener('click',()=>{quiz=!quiz;setSw($('quizSw'),quiz);store.set('sd-quiz',quiz?'1':'0');if(!quiz)revealed.clear();renderList()});
$('hideSw').addEventListener('click',()=>{hideKnown=!hideKnown;setSw($('hideSw'),hideKnown);renderList()});
$('expandBtn').addEventListener('click',()=>{items().forEach(x=>open.add(x.id));renderList()});
$('collapseBtn').addEventListener('click',()=>{items().forEach(x=>open.delete(x.id));renderList()});
$('menuBtn').addEventListener('click',()=>document.body.classList.add('rail-open'));
$('scrim').addEventListener('click',()=>document.body.classList.remove('rail-open'));

/* theme */
function effTheme(){const d=document.documentElement.getAttribute('data-theme');if(d)return d;return(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
function syncThemeBtn(){$('themeBtn').textContent=effTheme()==='dark'?'Light mode':'Dark mode'}
$('themeBtn').addEventListener('click',()=>{const n=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);store.set('sd-theme',n);syncThemeBtn()});
const th=store.get('sd-theme');if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);
syncThemeBtn();

/* reset */
let rt;$('resetBtn').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(b.dataset.arm){clearTimeout(rt);known.clear();saveKnown();b.dataset.arm='';b.textContent='Reset progress';renderAll();return}
  b.dataset.arm='1';b.textContent='Click again to clear all progress';
  rt=setTimeout(()=>{b.dataset.arm='';b.textContent='Reset progress'},3500);
});

/* drill */
let deck=[],di=0,shown=false,got=0,miss=[],lastFocus=null;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startDrill(list){
  if(!list.length){return}
  lastFocus=document.activeElement;
  deck=shuffle(list.slice());di=0;shown=false;got=0;miss=[];
  $('drill').hidden=false;document.body.style.overflow='hidden';
  drawDrill();
}
function closeDrill(){$('drill').hidden=true;document.body.style.overflow='';renderAll();if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function drawDrill(){
  const d=$('drill');
  if(di>=deck.length){
    d.innerHTML=`<div class="dcard"><div class="dsum"><h3>Round complete</h3>
      <p>${got} of ${deck.length} marked known${miss.length?', '+miss.length+' to review':''}.</p>
      <div class="dbtns" style="justify-content:center">${miss.length?`<button class="btn primary" id="dMiss">Drill the ${miss.length} missed</button>`:''}<button class="btn ${miss.length?'':'primary'}" id="dClose">Close</button></div></div></div>`;
    $('dClose').onclick=closeDrill;
    if($('dMiss'))$('dMiss').onclick=()=>{const m=miss.slice();deck=shuffle(m);di=0;shown=false;got=0;miss=[];drawDrill()};
    ($('dMiss')||$('dClose')).focus();return;
  }
  const x=deck[di];
  d.innerHTML=`<div class="dcard ${x.lvl}">
    <div class="dtop"><span>Card ${di+1} of ${deck.length} · ${esc(T[x.ti].t)} · <b style="color:var(--c)">${LV[x.lvl]}</b></span><button class="btn small" id="dExit">Exit</button></div>
    <p class="dq">${esc(x.q)}</p>
    ${shown?`<div class="answer"><p>${x.a}</p><div class="ex"><b>Example</b>${x.ex}</div></div>
      <div class="dbtns"><button class="btn primary" id="dGot">I knew it</button><button class="btn" id="dAgain">Review later</button></div>`
      :`<div class="dbtns"><button class="btn primary" id="dShow">Show answer</button><button class="btn" id="dSkip">Skip</button></div>`}
  </div>`;
  $('dExit').onclick=closeDrill;
  if(shown){
    $('dGot').onclick=()=>{known.add(x.id);saveKnown();got++;di++;shown=false;drawDrill()};
    $('dAgain').onclick=()=>{miss.push(x);di++;shown=false;drawDrill()};
    $('dGot').focus();
  }else{
    $('dShow').onclick=()=>{shown=true;drawDrill()};
    $('dSkip').onclick=()=>{di++;drawDrill()};
    $('dShow').focus();
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('drill').hidden)closeDrill();else document.body.classList.remove('rail-open')}});
$('drillTopic').addEventListener('click',()=>{
  const all=ALL.filter(x=>x.ti===cur);const unk=all.filter(x=>!known.has(x.id));
  startDrill(unk.length?unk:all);
});
$('drillAll').addEventListener('click',()=>{
  const unk=ALL.filter(x=>!known.has(x.id));
  startDrill(unk);
  if(!unk.length)$('drillAll').textContent='Everything is marked known';
});

if(quiz)setSw($('quizSw'),true);
renderAll();
})();
</script>
</body>
</html>
